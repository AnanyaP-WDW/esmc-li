name: wheels

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            python: "3.13"
          - os: ubuntu-22.04
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AnanyaP-WDW/esmc.cpp
          ref: c4b67436d5173eccc51ed2d0d849a8a8580f14a0
          path: esmc.cpp
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install build tools (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake patchelf
          python -m pip install patchelf auditwheel
          export PATH="$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))'):$PATH"
      - name: build wheel
        env:
          ESMC_CPP: ${{ github.workspace }}/esmc.cpp
          PYTHON: python
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: bash scripts/build_runtime_wheel.sh
      - name: repair Linux wheel
        if: runner.os == 'Linux'
        run: |
          auditwheel repair --plat manylinux_2_34_x86_64 -w dist-repaired dist/*.whl
          rm dist/*.whl
          mv dist-repaired/*.whl dist/
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
