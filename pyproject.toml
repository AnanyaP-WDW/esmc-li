[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "esmc-li"
version = "1.0.0"
description = "Fast local protein retrieval using ESM-C residue embeddings and late interaction."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Ananya Pathak"}]
maintainers = [{name = "Ananya Pathak"}]
keywords = ["protein", "retrieval", "ESM-C", "late interaction", "MaxSim", "bioinformatics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "huggingface_hub>=0.23"]

[project.urls]
Homepage = "https://github.com/AnanyaP-WDW/esmc-li"
Paper = "https://github.com/AnanyaP-WDW/esmc-li/blob/main/paper/main.md"
Source = "https://github.com/AnanyaP-WDW/esmc-li"
Issues = "https://github.com/AnanyaP-WDW/esmc-li/issues"
Changelog = "https://github.com/AnanyaP-WDW/esmc-li/blob/main/CHANGELOG.md"
Model = "https://huggingface.co/AnanyaPathak/esmc-li-300m-homology-v1"
Indexes = "https://huggingface.co/datasets/AnanyaPathak/esmc-li-indexes"

[project.optional-dependencies]
dev = ["pytest>=7", "requests>=2.28", "datasketch>=1.6"]
metal = ["pyobjc-framework-Metal>=10.0"]

[project.scripts]
esmc-li = "esmc_li.cli:main"

[tool.setuptools.packages.find]
include = ["esmc_li*"]

[tool.setuptools.package-data]
esmc_li = ["data/*.npy", "_runtime/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
