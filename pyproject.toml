[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esmc-retrieval"
version = "0.0.1"
description = "Fast local protein retrieval using ESM-C residue embeddings and late interaction."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "requests>=2.28", "datasketch>=1.6"]

[tool.setuptools.packages.find]
include = ["esmc_retrieval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
