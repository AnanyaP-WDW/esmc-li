<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="230" viewBox="0 0 1190 230">
<title>ESMC-LI retrieval pipeline</title>
<desc>Protein sequence to ESM-C residue embeddings, 128-dimensional projection, mmap index, and exact MaxSim top-k.</desc>
<rect width="1190" height="230" fill="#ffffff"/>
<text x="30" y="28" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#111">ESMC-LI retrieval pipeline</text>
<text x="30" y="48" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555">The database is encoded once; every query uses the same encoder, projection, and exact MaxSim scorer.</text>
<rect x="30" y="78" width="140" height="70" rx="10" fill="#f2f5ff" stroke="#4b5bd6" stroke-width="1.5"/>
<text x="100" y="103" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">Protein</text>
<text x="100" y="121" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">sequence</text>
<rect x="190" y="78" width="140" height="70" rx="10" fill="#f2f5ff" stroke="#4b5bd6" stroke-width="1.5"/>
<text x="260" y="103" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">ESM-C 300M</text>
<text x="260" y="121" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">(esmc.cpp)</text>
<rect x="350" y="78" width="140" height="70" rx="10" fill="#f2f5ff" stroke="#4b5bd6" stroke-width="1.5"/>
<text x="420" y="103" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">residue rows</text>
<text x="420" y="121" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">[L x 960]</text>
<rect x="510" y="78" width="140" height="70" rx="10" fill="#f2f5ff" stroke="#4b5bd6" stroke-width="1.5"/>
<text x="580" y="103" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">project 960->128</text>
<text x="580" y="121" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">+ L2</text>
<rect x="670" y="78" width="140" height="70" rx="10" fill="#f2f5ff" stroke="#4b5bd6" stroke-width="1.5"/>
<text x="740" y="103" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">residue rows</text>
<text x="740" y="121" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">[L x 128]</text>
<rect x="830" y="78" width="140" height="70" rx="10" fill="#f2f5ff" stroke="#4b5bd6" stroke-width="1.5"/>
<text x="900" y="103" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">.esmci</text>
<text x="900" y="121" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">mmap index</text>
<rect x="990" y="78" width="140" height="70" rx="10" fill="#f2f5ff" stroke="#4b5bd6" stroke-width="1.5"/>
<text x="1060" y="103" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">exact MaxSim</text>
<text x="1060" y="121" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">top-k</text>
<line x1="170" y1="113" x2="180" y2="113" stroke="#4b5bd6" stroke-width="2"/>
<polygon points="180,113 172,107 172,119" fill="#4b5bd6"/>
<line x1="330" y1="113" x2="340" y2="113" stroke="#4b5bd6" stroke-width="2"/>
<polygon points="340,113 332,107 332,119" fill="#4b5bd6"/>
<line x1="490" y1="113" x2="500" y2="113" stroke="#4b5bd6" stroke-width="2"/>
<polygon points="500,113 492,107 492,119" fill="#4b5bd6"/>
<line x1="650" y1="113" x2="660" y2="113" stroke="#4b5bd6" stroke-width="2"/>
<polygon points="660,113 652,107 652,119" fill="#4b5bd6"/>
<line x1="810" y1="113" x2="820" y2="113" stroke="#4b5bd6" stroke-width="2"/>
<polygon points="820,113 812,107 812,119" fill="#4b5bd6"/>
<line x1="970" y1="113" x2="980" y2="113" stroke="#4b5bd6" stroke-width="2"/>
<polygon points="980,113 972,107 972,119" fill="#4b5bd6"/>
<text x="710" y="176" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555">one 128-D vector per residue</text>
<text x="1060" y="176" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555">exact search</text>
</svg>
